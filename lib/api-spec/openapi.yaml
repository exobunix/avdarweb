      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FooterLinkUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FooterLink" }
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteFooterLink
      tags: [footer-links]
      summary: Delete footer link (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
