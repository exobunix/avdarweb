        "404":
          description: Not found
    delete:
      operationId: deleteBlogPost
      tags: [blog-posts]
      summary: Delete blog post (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ---------- Career roles ----------
  /career-roles:
    get:
      operationId: listCareerRoles
      tags: [career-roles]
      summary: List career roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CareerRole" }
    post:
      operationId: createCareerRole
      tags: [career-roles]
      summary: Create career role (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareerRoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareerRole" }
        "401":
          description: Unauthorized
  /career-roles/{id}:
    patch:
      operationId: updateCareerRole
      tags: [career-roles]
      summary: Update career role (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareerRoleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareerRole" }
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteCareerRole
      tags: [career-roles]
      summary: Delete career role (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ---------- Page content ----------
  /page-content/{page}:
    get:
      operationId: listPageContent
      tags: [page-content]
      summary: List content blocks for a page
      parameters:
        - { name: page, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PageContentBlock" }
  /page-content/{page}/{key}:
    put:
      operationId: upsertPageContentBlock
      tags: [page-content]
      summary: Create or update a content block (admin)
      parameters:
        - { name: page, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PageContentBlockInput" }
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageContentBlock" }
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AdminCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }

    SiteSettings:
      type: object
      required:
        [
          id,
          siteName,
          logoUrl,
          tagline,
          contactEmail,
          contactPhones,
          contactAddress,
          mapEmbedUrl,
          socialLinks,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        siteName: { type: string }
        logoUrl: { type: string }
        tagline: { type: string }
        contactEmail: { type: string }
        contactPhones: { type: array, items: { type: string } }
        contactAddress: { type: string }
        mapEmbedUrl: { type: string }
        socialLinks:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
        updatedAt: { type: string, format: date-time }
    SiteSettingsInput:
      type: object
      properties:
        siteName: { type: string }
        logoUrl: { type: string }
        tagline: { type: string }
        contactEmail: { type: string }
        contactPhones: { type: array, items: { type: string } }
        contactAddress: { type: string }
        mapEmbedUrl: { type: string }
        socialLinks:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }

    ThemeColors:
      type: object
      required:
        [
          background,
          foreground,
          primary,
          primaryForeground,
          accent,
          accentForeground,
          card,
          border,
          muted,
          mutedForeground,
        ]
      properties:
        background: { type: string }
        foreground: { type: string }
        primary: { type: string }
        primaryForeground: { type: string }
        accent: { type: string }
        accentForeground: { type: string }
        card: { type: string }
        border: { type: string }
        muted: { type: string }
        mutedForeground: { type: string }
    ThemeSettings:
      type: object
      required:
        [
          id,
          defaultMode,
          activePreset,
          headingFont,
          bodyFont,
          customLight,
          customDark,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        defaultMode: { type: string, enum: [dark, light] }
        activePreset: { type: string }
        headingFont: { type: string }
        bodyFont: { type: string }
        customLight: { $ref: "#/components/schemas/ThemeColors" }
        customDark: { $ref: "#/components/schemas/ThemeColors" }
        updatedAt: { type: string, format: date-time }
    ThemeSettingsInput:
      type: object
      properties:
        defaultMode: { type: string, enum: [dark, light] }
        activePreset: { type: string }
        headingFont: { type: string }
        bodyFont: { type: string }
        customLight: { $ref: "#/components/schemas/ThemeColors" }
        customDark: { $ref: "#/components/schemas/ThemeColors" }

    NavLink:
      type: object
      required: [id, label, href, order, createdAt]
      properties:
        id: { type: integer }
        label: { type: string }
        href: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
    NavLinkInput:
      type: object
      required: [label, href]
      properties:
        label: { type: string, minLength: 1 }
        href: { type: string, minLength: 1 }
        order: { type: integer }
    NavLinkUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        href: { type: string, minLength: 1 }
        order: { type: integer }

    FooterLink:
      type: object
      required: [id, section, label, href, order, createdAt]
      properties:
        id: { type: integer }
        section: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
    FooterLinkInput:
      type: object
      required: [section, label, href]
      properties:
        section: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        href: { type: string, minLength: 1 }
        order: { type: integer }
    FooterLinkUpdate:
      type: object
      properties:
        section: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        href: { type: string, minLength: 1 }
        order: { type: integer }

    Service:
      type: object
      required: [id, title, description, icon, order, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        icon: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        order: { type: integer }
    ServiceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        order: { type: integer }

    Product:
      type: object
      required:
        [id, title, category, description, image, features, order, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        image: { type: string }
        features: { type: array, items: { type: string } }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string }
        description: { type: string }
        image: { type: string }
        features: { type: array, items: { type: string } }
        order: { type: integer }
    ProductUpdate:
