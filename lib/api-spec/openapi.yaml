openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-auth
    description: Admin authentication
  - name: site-settings
    description: Global site identity and contact info
  - name: theme-settings
    description: Sitewide theme configuration
  - name: nav-links
    description: Header navigation menu
  - name: footer-links
    description: Footer link columns
  - name: services
    description: Services offered
  - name: products
    description: Product catalog
  - name: portfolio-projects
    description: Portfolio case studies
  - name: industries
    description: Industries served
  - name: blog-posts
    description: Blog articles
  - name: career-roles
    description: Open career roles
  - name: page-content
    description: Free-text content blocks per page
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- Admin auth ----------
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Log in as admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /admin/me:
    get:
      operationId: getAdminSession
      tags: [admin-auth]
      summary: Get current admin session
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"

  # ---------- Site settings ----------
  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [site-settings]
      summary: Get global site settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSiteSettings
      tags: [site-settings]
      summary: Update global site settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Unauthorized

  # ---------- Theme settings ----------
  /theme-settings:
    get:
      operationId: getThemeSettings
      tags: [theme-settings]
      summary: Get sitewide theme settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSettings"
    put:
      operationId: updateThemeSettings
      tags: [theme-settings]
      summary: Update sitewide theme settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSettings"
        "401":
          description: Unauthorized

  # ---------- Nav links ----------
  /nav-links:
    get:
      operationId: listNavLinks
      tags: [nav-links]
      summary: List nav links
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NavLink" }
    post:
      operationId: createNavLink
      tags: [nav-links]
      summary: Create nav link (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavLinkInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavLink" }
        "401":
          description: Unauthorized
  /nav-links/{id}:
    patch:
      operationId: updateNavLink
      tags: [nav-links]
      summary: Update nav link (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavLinkUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavLink" }
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteNavLink
      tags: [nav-links]
      summary: Delete nav link (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ---------- Footer links ----------
  /footer-links:
