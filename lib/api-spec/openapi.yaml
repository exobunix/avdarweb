  # ---------- Industries ----------
  /industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: List industries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Industry" }
    post:
      operationId: createIndustry
      tags: [industries]
      summary: Create industry (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryInput" }
      responses:
        "201":
          description: Created
          content:
