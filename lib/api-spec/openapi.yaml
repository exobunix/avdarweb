          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401":
          description: Unauthorized
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
